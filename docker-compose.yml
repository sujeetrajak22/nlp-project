version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./visualizations:/app/visualizations
    environment:
      - DEFAULT_MODEL=tfidf_lr
      - MAX_INPUT_LENGTH=10000
      - CONFIDENCE_THRESHOLD=0.5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
